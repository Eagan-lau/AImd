version: 1
family:
  key: cyp450
  plugin: cyp450
  runner: cyp450
  name: CYP450
  version: 2.0.0
  description: Pure YAML family spec for cytochrome P450s.
input:
  protein_extension: .pdbqt
  ligand_extension: .pdbqt
  ligand_pattern: '{ligand_id}@{protein_name}{ligand_extension}'
  out_pattern: '{ligand_id}_{protein_name}_cavity_1.out'
  protein_object: protein
  ligand_object: ligand
  affinity_threshold: -3.0
aggregation:
  total_confs: 6
  cover_t: 70.0
  alpha: 0.3
output:
  save_pse: true
  row_fields:
    - name: lig_h_atom_id
      ref: lig_h_atom
      attr: atom_id
    - name: lig_c_atom_id
      ref: parent_atom
      attr: atom_id
    - name: fe_atom_id
      ref: fe_atom
      attr: atom_id
    - name: prox_sg_atom_id
      ref: prox_sg
      attr: atom_id
    - name: heme_n1_id
      ref: heme_n1
      attr: atom_id
    - name: heme_n2_id
      ref: heme_n2
      attr: atom_id
    - name: heme_n3_id
      ref: heme_n3
      attr: atom_id
resources: {}
globals:
  fe_atom:
    op: select_first_atom_any
    selectors:
      - '{protein_obj} and elem Fe'
      - '{protein_obj} and name FE'
  prox_sg:
    op: select_first_atom_any
    selectors:
      - '{protein_obj} and name SG within 4 of ({protein_obj} and elem Fe)'
      - '{protein_obj} and name SG within 6 of ({protein_obj} and elem Fe)'
  heme_triplet:
    op: select_atom_triplet
    preferred_selectors:
      - '{protein_obj} and resn HEM+HEME+HEC and name NA'
      - '{protein_obj} and resn HEM+HEME+HEC and name NB'
      - '{protein_obj} and resn HEM+HEME+HEC and name NC'
      - '{protein_obj} and resn HEM+HEME+HEC and name ND'
      - '{protein_obj} and resn HEM+HEME+HEC and name N1'
      - '{protein_obj} and resn HEM+HEME+HEC and name N2'
      - '{protein_obj} and resn HEM+HEME+HEC and name N3'
      - '{protein_obj} and resn HEM+HEME+HEC and name N4'
    fallback_selector: '{protein_obj} and resn HEM+HEME+HEC and name N*'
  heme_n1:
    op: item_from_collection
    collection: heme_triplet
    index: 0
  heme_n2:
    op: item_from_collection
    collection: heme_triplet
    index: 1
  heme_n3:
    op: item_from_collection
    collection: heme_triplet
    index: 2
  heme_normal:
    op: plane_normal
    a: heme_n1
    b: heme_n2
    c: heme_n3
  axis:
    op: oriented_normal
    normal: heme_normal
    origin: fe_atom
    reference: prox_sg
pose:
  add_hydrogens: true
  objects:
    ch_sites:
      op: collect_ch_pairs
      h_cutoff: 1.25
    pose_clash:
      op: pose_clash
      cutoff: 2.0
candidates:
  op: source
  collection: ch_sites
features:
  - name: dist_FE_H
    op: distance
    a: fe_atom
    b: lig_h_atom
  - name: dist_FE_C
    op: distance
    a: fe_atom
    b: parent_atom
  - name: axis_dev_deg
    op: axis_deviation
    axis: axis
    origin: fe_atom
    target: parent_atom
  - name: clash_flag
    op: alias
    source: pose_clash
gating:
  logic: all
  rules:
    - feature: dist_FE_H
      op: between
      min: 3.0
      max: 5.0
    - feature: axis_dev_deg
      op: <=
      value: 45.0
    - feature: clash_flag
      op: ==
      value: false
scoring:
  transforms:
    - name: affinity_score
      op: energy_linear
      source: affinity_kcal
      full: -7.0
      zero: -3.0
    - name: dist_score
      op: piecewise_linear
      source: dist_FE_H
      points:
        - [2.5, 0.0]
        - [3.0, 1.0]
        - [3.8, 1.0]
        - [5.0, 0.0]
    - name: angle_score
      op: piecewise_linear
      source: axis_dev_deg
      points:
        - [0.0, 1.0]
        - [15.0, 1.0]
        - [45.0, 0.0]
  intermediates: []
  pose_score:
    op: weighted_sum
    scale: 100.0
    terms:
      - source: affinity_score
        weight: 0.3
      - source: dist_score
        weight: 0.4
      - source: angle_score
        weight: 0.3
