version: 1
family:
  key: ugt
  plugin: ugt
  runner: ugt
  name: UGT
  version: 2.0.0
  description: Pure YAML family spec for UDP-glycosyltransferases.
input:
  protein_extension: .pdbqt
  ligand_extension: .pdbqt
  ligand_pattern: '{ligand_id}@{protein_name}{ligand_extension}'
  out_pattern: '{ligand_id}_{protein_name}_cavity_1.out'
  protein_object: protein
  ligand_object: ligand
  affinity_threshold: -3.0
aggregation:
  total_confs: 6
  cover_t: 70.0
  alpha: 0.3
output:
  save_pse: true
  row_fields:
    - name: ne2_atom_id
      ref: his_ne2
      attr: atom_id
    - name: o_atom_id
      ref: nucleophile_atom
      attr: atom_id
    - name: c1_atom_id
      ref: donor_c1
      attr: atom_id
    - name: o1_atom_id
      ref: donor_o1
      attr: atom_id
resources: {}
globals:
  donor_c1:
    op: select_first_atom
    selector: '{protein_obj} and resn U2F and name C1'
  donor_o1:
    op: select_first_atom
    selector: '{protein_obj} and resn U2F and name O1'
  his_ne2_candidates:
    op: select_atoms_within
    candidate_selector: '{protein_obj} and resn HIS+HIE+HID+HIP and name NE2'
    reference: donor_c1
    radius: 10.0
pose:
  add_hydrogens: false
  objects:
    nucleophile_sites:
      op: collect_hydroxyl_sites
    pose_clash:
      op: pose_clash
      cutoff: 2.0
candidates:
  op: cartesian_product
  members:
    his_ne2: his_ne2_candidates
    nucleophile_atom: nucleophile_sites
features:
  - name: dist_NE2_O
    op: distance
    a: his_ne2
    b: nucleophile_atom
  - name: dist_C1_O
    op: distance
    a: donor_c1
    b: nucleophile_atom
  - name: angle_deg
    op: angle
    a: donor_o1
    b: donor_c1
    c: nucleophile_atom
  - name: clash_flag
    op: alias
    source: pose_clash
gating:
  logic: all
  rules:
    - feature: dist_NE2_O
      op: <=
      value: 5.0
    - feature: dist_C1_O
      op: <=
      value: 5.0
    - feature: angle_deg
      op: between
      min: 100.0
      max: 180.1
    - feature: clash_flag
      op: ==
      value: false
scoring:
  transforms:
    - name: affinity_score
      op: energy_linear
      source: affinity_kcal
      full: -7.0
      zero: -3.0
    - name: d1_score
      op: distance_piecewise
      source: dist_NE2_O
      best: 3.2
      cutoff: 5.0
    - name: d2_score
      op: distance_piecewise
      source: dist_C1_O
      best: 3.2
      cutoff: 5.0
    - name: angle_score
      op: gaussian
      source: angle_deg
      target: 180.0
      sigma: 30.0
      flat: 25.0
      fold180: true
  intermediates:
    - name: D_score
      op: coupled_mean_positive
      sources: [d1_score, d2_score]
  pose_score:
    op: weighted_sum
    scale: 100.0
    terms:
      - source: affinity_score
        weight: 0.3
      - source: D_score
        weight: 0.4
      - source: angle_score
        weight: 0.3
