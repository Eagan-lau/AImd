# Fe2OG or 2-ODD C-H oxidation mechanism file.
# Generic mode uses ligand heavy atom geometry: Fe to reactive carbon.

ligand_sites:
  reactive_c:
    # EDIT: Carbon atoms bearing hydrogen in the source ligand.
    atom_classes:
      - hydrogen_bearing_carbon
    required: true

protein_roles:
  - role: catalytic_fe
    # EDIT: Find catalytic Fe near ligand reactive C.
    from: ligand.reactive_c
    radius: 7.0
    required: true
    atoms:
      - elem Fe
      - name FE

  - role: metal_ligand_atoms
    # OPTIONAL: Local His/Asp/Glu atoms around Fe. This validates metal-center context.
    from: protein.catalytic_fe
    radius: 3.2
    required: false
    collection: true
    min_count: 2
    preferred_count: 4
    residues:
      HIS: [ND1, NE2]
      ASP: [OD1, OD2]
      GLU: [OE1, OE2]

features:
  fe_c_distance:
    type: distance
    atoms:
      - protein.catalytic_fe
      - ligand.reactive_c
    gate:
      min: 2.5
      max: 7.0
      required: true
    score:
      level: 1
      transform: distance_piecewise
      best: 4.5
      cutoff: 7.0
      weight: 1.0
