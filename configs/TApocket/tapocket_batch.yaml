module: TApocketBridge
name: Batch TApocket pocket prediction from RGPC protein batches

paths:
  # All paths can be absolute or relative to the AImd root directory.
  aimd_root: .

  # Input generated by RGPC.
  protein_manifest: data/data_output/protein_batches/protein_manifest.csv

  # Bundled TApocket project and its native single-query config.
  tapocket_project_dir: TApocket
  tapocket_config: TApocket/configs/tapocket_template_v1.yaml

  # Standard AImd pocket output.
  out_dir: data/data_output/pocket

input:
  require_existing_files: true

selection:
  # all | representatives_only
  # `representatives_only` is useful when the next stage should only evaluate cluster representatives.
  mode: all
  max_proteins: null

prepare:
  # Set these to true when running TApocket for the first time after populating the template/M-CSA databases.
  check_layout: false
  build_manifest: false
  build_index: false
  build_index_db: all      # template | mcsa | all
  force_index: false
  create_index: false

execution:
  # Keep 1 by default because the PyMOL-based mapper is safer in sequential execution.
  workers: 1
  continue_on_error: true
  write_traceback: true

output:
  # copy | symlink
  file_action: copy
  overwrite: true

resume:
  enabled: true
  skip_existing: true
