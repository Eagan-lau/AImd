module: RGPC
name: Representative Graph-based Protein Clustering

third_party:
  tools_config: third_party/tools.yaml

paths:
  # All paths can be absolute or relative to the AImd root directory.
  aimd_root: .
  structure_dir: data/data_input/protein
  structure_manifest: data/data_input/protein/structure_manifest.csv
  out_dir: data/data_output/cluster/RGPC
  protein_out_dir: data/data_output/protein_batches

input:
  file_extensions: [".pdb", ".cif", ".mmcif"]
  recursive: true
  require_existing_files: true

foldseek:
  executable: auto
  mode: all_vs_all     # all_vs_all or per_query
  threads: 32
  tmp_dir: data/data_output/cluster/RGPC/tmp
  createdb:
    enabled: true
    db_prefix: data/data_output/cluster/RGPC/foldseek_db/protein_db
  search:
    result_db: data/data_output/cluster/RGPC/foldseek_search/result_db
    raw_tsv: data/data_output/cluster/RGPC/foldseek_search/all_vs_all.tsv
    sensitivity: null      # example: 7.5. Keep null to omit.
    require_backtrace: true  # required for qtmscore/ttmscore in many Foldseek builds
    extra_args: []         # example: ["--max-seqs", "10000"]
  convertalis:
    format_output: "query,target,qtmscore,ttmscore"

filter:
  remove_self_hits: true
  min_qtmscore: 0.5
  min_ttmscore: 0.5
  weight_method: min_qtmscore_ttmscore  # min_qtmscore_ttmscore, mean_qtmscore_ttmscore, geometric_mean, alntmscore

# Build an undirected graph for HipMCL/MCL-style clustering.
graph:
  make_symmetric: true
  duplicate_edge_method: min   # min, max, mean
  write_header_tsv: true

hipmcl:
  enabled: true
  executable: auto
  inflation: 2.0
  # OpenMP threads per MPI process.
  threads: 1
  mpi_processes: 4
  per_process_mem_gb: 2
  extra_args: []
  input_abc: data/data_output/cluster/RGPC/graph/structure_edges.abc
  output: data/data_output/cluster/RGPC/hipmcl/hipmcl_output.txt
  log: data/data_output/cluster/RGPC/hipmcl/hipmcl.log
  # Modify this line if your HipMCL command differs.
  command_template: "OMP_NUM_THREADS={threads} mpirun -np {mpi_processes} {executable} -M {input} -I {inflation} -per-process-mem {per_process_mem_gb} -o {output} {extra_args}"

representative:
  method: highest_mean_similarity  # highest_mean_similarity or first

batching:
  enabled: true
  output_to_protein_dir: true
  mode: by_cluster
  max_proteins_per_batch: 500
  keep_cluster_together: true
  output_pattern: file_{index}
  file_action: copy     # copy or symlink
  include_only_representatives: false

resume:
  enabled: true
  skip_existing: true

dry_run: false
