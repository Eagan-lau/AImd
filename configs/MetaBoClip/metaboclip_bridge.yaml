module: MetaBoClipBridge
name: Unified MetaboClip backend after refined docking
backend: unified

paths:
  aimd_root: .

  # Input from RefinementHub / refined DockingHub.
  refined_docking_manifest: data/data_output/refined/docking_out/docking_result_manifest.csv

  # Unified MetaboClip backend and profile.
  metaboclip_project_dir: metaboclip_unified
  metaboclip_profile: metaboclip_unified/metaboclip/config/profiles/default_profile.yaml

  # Bridge-generated staging layout, unified outputs, and final AImd-facing outputs.
  staging_dir: data/data_output/metaboclip/staging
  unified_output_dir: data/data_output/metaboclip/unified_runs
  results_dir: data/data_output/metaboclip/results

  # Ligand role-map inputs and outputs.
  ligand_manifest: data/data_output/ligand_preparation/ligand_manifest.csv
  ligand_source_manifest: data/data_output/ligand_transformation/ligand_source_manifest.csv
  role_table_dir: data/data_output/metaboclip/ligand_roles/role_tables
  annotation_dir: data/data_output/metaboclip/ligand_roles/annotations
  atom_map_dir: data/data_output/metaboclip/ligand_roles/atom_maps

filtering:
  require_success_status: true
  require_existing_pose_and_log: true
  # Optional: only pass rows with best_affinity <= this value. null disables this filter.
  max_affinity_kcal: null

family_assignment:
  # run_all | fixed | cluster_family_map | column
  # run_all is safest when you do not yet know which catalytic family each cluster belongs to.
  mode: run_all

  all_families:
    - cyp450
    - fe2og
    - ugt
    - act
    - ach

  fixed_families:
    - cyp450

  # Used when mode = cluster_family_map.
  # Format: cluster_id,family   or cluster_id,families
  cluster_family_map_csv: data/data_input/workflow/cluster_family_map.csv
  fallback_to_all_when_unmapped: false

  # Used when mode = column.
  family_column: family

mechanisms:
  cyp450: metaboclip_unified/metaboclip/config/families/cyp450/mechanism.yaml
  fe2og: metaboclip_unified/metaboclip/config/families/fe2og/mechanism.yaml
  ugt: metaboclip_unified/metaboclip/config/families/ugt/mechanism.yaml
  act: metaboclip_unified/metaboclip/config/families/act/mechanism.yaml
  ach: metaboclip_unified/metaboclip/config/families/ach/mechanism.yaml

role_tables:
  # existing | generate | auto
  # existing reuses prebuilt role tables.
  # generate builds role tables from ligand source files and prepared ligand PDBQT files.
  # auto reuses existing role tables and generates only missing ones when source inputs are available.
  mode: auto
  rules: metaboclip_unified/rules/functional_groups.yaml
  groups: []
  ligand_source_column: ligand_source_path
  prepared_pdbqt_column: ligand_pdbqt_path
  max_dist: 0.5

execution:
  run_metaboclip: true
  continue_on_error: true

output:
  file_action: copy
  overwrite: true
