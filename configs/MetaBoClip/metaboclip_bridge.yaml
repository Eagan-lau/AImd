module: MetaBoClipBridge
name: Catalytic geometry gating and family-specific pose/protein scoring after refined docking

paths:
  aimd_root: .

  # Input from RefinementHub / refined DockingHub.
  refined_docking_manifest: data/refined/docking_out/docking_result_manifest.csv

  # Bundled MetaBoClip project.
  metaboclip_project_dir: MetaBoClip

  # Bridge-generated staging layout and final outputs.
  staging_dir: data/metaboclip/staging
  results_dir: data/metaboclip/results

filtering:
  require_success_status: true
  require_existing_pose_and_log: true
  # Optional: only pass rows with best_affinity <= this value. null disables this filter.
  max_affinity_kcal: null

family_assignment:
  # run_all | fixed | cluster_family_map | column
  # run_all is safest when you do not yet know which catalytic family each cluster belongs to.
  mode: run_all

  all_families:
    - cyp450
    - fe2og
    - ugt
    - act
    - ach

  fixed_families:
    - cyp450

  # Used when mode = cluster_family_map.
  # Format: cluster_id,family   or cluster_id,families
  cluster_family_map_csv: data/input/cluster_family_map.csv
  fallback_to_all_when_unmapped: false

  # Used when mode = column.
  family_column: family

# Optional external family specs; each may be a family.yaml, a family directory, or a directory containing many families.
plugin_dirs: []

# Built-in family overlays from MetaBoClip. These can be replaced by your own configs.
family_instance_configs:
  cyp450: MetaBoClip/configs/CYP450/instance.yaml
  fe2og: MetaBoClip/configs/Fe2OG/instance.yaml
  ugt: MetaBoClip/configs/UGT/instance.yaml
  act: MetaBoClip/configs/ACT/instance.yaml
  ach: MetaBoClip/configs/ACH/instance.yaml

# Common overlay deep-merged into every family YAML before execution.
metaboclip_config_overlay:
  input:
    affinity_threshold: -3.0
  aggregation:
    total_confs: 6
    cover_t: 70.0
    alpha: 0.3
  output:
    save_pse: true

execution:
  run_metaboclip: true
  continue_on_error: true

output:
  file_action: copy
  overwrite: true
