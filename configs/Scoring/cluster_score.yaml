module: ClusterScore
name: Best-affinity extraction and cluster-level prioritization after docking

paths:
  aimd_root: .

  # Preferred input from DockingHub.
  docking_result_manifest: data/data_output/docking_out/docking_result_manifest.csv

  # Fallback input: directly scan data/data_output/docking_out/file_*/*.out when manifest is absent.
  docking_out_dir: data/data_output/docking_out

  # Optional: used to fill cluster_id if docking_result_manifest does not contain it.
  protein_manifest: data/data_output/protein_batches/protein_manifest.csv

  # Standard outputs.
  clusterscore_out_dir: data/data_output/scoring/ClusterScore

affinity_extraction:
  # Extract the first Vina pose affinity as the best binding energy.
  num_affinities: 9
  best_pose_index: 1
  scan_logs_when_manifest_missing: true

  # For repeated ligand-protein jobs caused by multiple pockets/conformers,
  # keep the most favorable affinity, i.e. the minimum kcal/mol value.
  duplicate_policy: best_min_affinity

clusterscore:
  # Strong binding: affinity <= strong_threshold.
  strong_threshold: -7.0

  # Weak binding: strong_threshold < affinity <= weak_threshold.
  weak_threshold: -3.0

  # Missing matrix values: ignore | no_binding
  missing_policy: ignore
  missing_fill_value: 0.0

  # Adjustable parameters in the formula below.
  alpha: 0.2
  beta: 0.2

  # Default formula from the current ClusterScore script:
  # total_strong_count + alpha * total_weak_count + n_proteins * (avg_strong_ratio + beta * avg_weak_ratio)
  formula: "total_strong_count + alpha * total_weak_count + n_proteins * (avg_strong_ratio + beta * avg_weak_ratio)"

  sort_by: composite_score
  sort_ascending: false
  top_n: 10

output:
  excel_name: clusterscore_results.xlsx

plots:
  enabled: false
  top_n: 10
  dpi: 300
