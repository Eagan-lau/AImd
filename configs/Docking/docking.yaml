module: DockingHub
third_party:
  tools_config: third_party/tools.yaml

name: Ensemble/cofactor-aware docking hub for AImd

paths:
  aimd_root: .

  # Inputs from upstream modules.
  protein_manifest: data/data_output/protein_batches/protein_manifest.csv
  pocket_manifest: data/data_output/pocket/pocket_manifest.csv
  ligand_manifest: data/data_output/ligand_preparation/ligand_manifest.csv
  ligand_dir: data/data_output/ligand_preparation/pdbqt

  # Optional cofactor template library. Use one folder per batch: data/data_input/cofactor/file_1/*.pdb
  cofactor_dir: data/data_input/cofactor

  # Standard outputs.
  ensemble_dir: data/data_output/ensemble
  cofactor_mapped_dir: data/data_output/cofactor_mapped
  receptor_dir: data/data_output/receptor
  docking_config_dir: data/data_output/docking_configs
  docking_task_dir: data/data_output/docking_tasks
  docking_out_dir: data/data_output/docking_out

input:
  require_existing_files: true

ligand_preparation:
  enabled: true
  source_csv: data/data_input/ligand/taxane_molecules.csv
  output_dir: data/data_output/ligand_preparation
  batch_id: file_1
  max_ligands: 5
  smiles_column: smiles
  id_column: source_id
  name_column: molecule_name
  overwrite: false
  rdkit:
    random_seed: 61453
    max_attempts: 20
    optimize: true
    force_field: MMFF
    max_iters: 500
  pdbqt:
    executable: auto
    command_template: "{executable} -l {input_pdb} -o {output_pdbqt} {extra_options}"
    extra_options: ""
    timeout: 3600

selection:
  # all | representatives_only
  protein_mode: all
  max_proteins: null
  top_n_pockets_per_protein: 1

pairing:
  # all_vs_all | by_batch | explicit_pairs
  mode: all_vs_all
  pairs_csv: data/data_input/workflow/docking_pairs.csv

ensemble:
  enabled: false
  # command | alphaflow
  engine: alphaflow

  # Generic command mode is kept for custom ensemble generators.
  command_template: ""
  threads: 1
  timeout: 86400
  max_conformers_per_protein: 6
  collect_patterns:
    - "*.pdb"
  fallback_to_input: true

  alphaflow:
    # Keep these empty in the distributable config. Set them in a local config,
    # or export ALPHAFLOW_ROOT and ALPHAFLOW_PYTHON before running AImd.
    project_dir: ""
    python_executable: ""
    predict_script: predict2.py
    mmseqs_script: scripts/mmseqs_query.py
    weights: alphaflow_12l_md_templates_base_202406.pt
    mode: alphafold
    samples: 5
    steps: 10
    run_msa: false
    run_prediction: true
    require_msa: true
    template_mode: copy_input
    # Set in a local config when a specific GPU is required, for example "1".
    cuda_visible_devices: ""
    pytorch_cuda_alloc_conf: "garbage_collection_threshold:0.6,max_split_size_mb:128"
    extra_args: ""
    paths:
      # Leave blank to use per-protein output folders under data/data_output/ensemble.
      msa_dir: ""
      templates_dir: ""

  # Important AImd rule:
  # TApocket is run only on the original protein structure. When ensemble docking
  # is enabled, each sampled conformer is aligned back to the original structure
  # coordinate frame, and the original TApocket pocket box is reused.
  align_to_reference:
    enabled: true
    pymol_executable: auto
    timeout: 3600
    fallback_to_unaligned: false

cofactor:
  enabled: false
  # If true, select the most structurally similar cofactor template by Foldseek from data/data_input/cofactor/file_*.
  # If false, the first template in the corresponding batch folder is used.
  use_foldseek: false
  fallback_to_first: true
  continue_without_cofactor_on_error: true

  # Examples: CYP450: [HEM]; Fe2OG: [FE, AKG]; UGT donor template: [UDP, U2F]
  cofactor_residue_names:
    - HEM

  foldseek:
    executable: auto
    threads: 8
    timeout: 86400

  alignment:
    # Requires PyMOL command-line executable.
    pymol_executable: auto
    timeout: 3600

receptor_preparation:
  enabled: true
  executable: auto
  command_template: "{executable} -r {input_pdb} -o {output_pdbqt} -A hydrogens {extra_options}"
  extra_options: ""
  timeout: 3600

docking:
  engine: vina
  run: true
  vina:
    executable: auto
    exhaustiveness: 8
    cpu_per_job: 4
    additional_params: ""
    timeout: 3600

execution:
  threads: 8
  workers: null
  continue_on_error: true

postprocess:
  num_affinities: 9

output:
  overwrite: false
  file_action: copy
